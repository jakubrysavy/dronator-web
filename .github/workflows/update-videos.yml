name: Update YouTube videos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YouTube extractor
        run: python -m pip install yt-dlp

      - name: Update video data
        run: python scripts/update-videos.py

      - name: Commit updated video data
        run: |
          if git diff --quiet -- videos.js; then
            echo "Video data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.js
          git commit -m "Update latest YouTube videos"
          git push